name: Sync mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fast-forward main from canonical, refuse a rewrite
        env:
          # A token scoped to this one repository with Contents and Workflows
          # write. The default Actions token may not push commits that touch
          # .github/workflows/, and canonical main does change its workflows,
          # so the fallback works only until the next such commit and then
          # fails loudly rather than silently falling behind.
          PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch main "https://github.com/${GITHUB_REPOSITORY}.git" mirror
          cd mirror
          git remote add canonical https://github.com/agentrust-io/trace-registry.git
          git fetch --quiet canonical main

          before="$(git rev-parse HEAD)"
          target="$(git rev-parse canonical/main)"
          if ! git merge-base --is-ancestor "$before" "$target"; then
            echo "::error::canonical main ($target) does not descend from mirror main ($before). Possible history rewrite. Mirror left untouched."
            exit 1
          fi
          if [ "$before" = "$target" ]; then
            echo "mirror main already at canonical: $target"
            exit 0
          fi
          git merge --quiet --ff-only canonical/main
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --quiet origin main
          echo "mirror main: $before -> $(git rev-parse HEAD)"
