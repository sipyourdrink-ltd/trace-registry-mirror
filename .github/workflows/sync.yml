name: Sync mirror

on:
  schedule:
    # Twice an hour. The canonical health check runs every 6 hours and reports a
    # mirror that is merely behind as diverged, so the window has to stay short.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Prove the push token can write a commit that touches a workflow file (throwaway branch, deleted afterwards). main is not touched."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !inputs.selftest }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fast-forward main from canonical, refuse a rewrite
        env:
          # A token scoped to this one repository with Contents and Workflows
          # write. The default Actions token may not push commits that touch
          # .github/workflows/, and canonical main does change its workflows,
          # so the fallback works only until the next such commit and then
          # fails loudly rather than silently falling behind.
          PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch main "https://github.com/${GITHUB_REPOSITORY}.git" mirror
          cd mirror
          git remote add canonical https://github.com/agentrust-io/trace-registry.git
          git fetch --quiet canonical main

          before="$(git rev-parse HEAD)"
          target="$(git rev-parse canonical/main)"
          if ! git merge-base --is-ancestor "$before" "$target"; then
            echo "::error::canonical main ($target) does not descend from mirror main ($before). Possible history rewrite. Mirror left untouched."
            exit 1
          fi
          if [ "$before" = "$target" ]; then
            echo "mirror main already at canonical: $target"
            exit 0
          fi
          git merge --quiet --ff-only canonical/main
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --quiet origin main
          echo "mirror main: $before -> $(git rev-parse HEAD)"

  selftest:
    if: ${{ inputs.selftest }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Push and delete a throwaway branch whose commit touches a workflow file
        env:
          PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_TOKEN}" ]; then
            echo "::error::MIRROR_PUSH_TOKEN is not set"
            exit 1
          fi
          git clone --quiet --branch main --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" probe
          cd probe
          git config user.name "mirror selftest"
          git config user.email "selftest@invalid"
          mkdir -p .github/workflows
          printf 'name: selftest-probe\non: workflow_dispatch\njobs: {}\n' > .github/workflows/zz-selftest-probe.yml
          git add .github/workflows/zz-selftest-probe.yml
          git commit --quiet -m "selftest probe, never merged"
          ref="selftest-${GITHUB_RUN_ID}"
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          push() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push --quiet origin "$@"; }
          push "HEAD:refs/heads/${ref}"
          echo "pushed ${ref}: the token can write commits that touch workflow files"
          push ":refs/heads/${ref}"
          echo "deleted ${ref}"
